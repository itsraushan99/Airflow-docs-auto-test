name: Generate DAG Documentation

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-documentation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Airflow
        run: |
          AIRFLOW_VERSION=3.0.6
          PYTHON_VERSION=$(python -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
          CONSTRAINT_URL="https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          python -m pip install --upgrade pip
          pip install "apache-airflow==${AIRFLOW_VERSION}" --constraint "${CONSTRAINT_URL}"

      - name: Detect changed DAG files
        id: changed
        run: |
          ALL_DAGS=$(find dags -name "*.py" | sort | tr '\n' ' ')

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CHANGED="$ALL_DAGS"

          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            CHANGED=$(git diff --name-only "$BASE"...HEAD -- 'dags/*.py' | tr '\n' ' ')
            # If diff is empty (e.g. first PR or no prior commits), fall back to all
            if [ -z "$(echo $CHANGED | tr -d ' ')" ]; then
              CHANGED="$ALL_DAGS"
            fi

          else
            # push event
            PARENT_COUNT=$(git rev-list --count HEAD)
            if [ "$PARENT_COUNT" -le 1 ]; then
              # First commit — no parent to diff against, regenerate all
              CHANGED="$ALL_DAGS"
            else
              CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'dags/*.py' | tr '\n' ' ')
              # If nothing changed in dags/ but docs are missing, regenerate all missing
              MISSING=""
              for f in $ALL_DAGS; do
                stem=$(basename "$f" .py)
                doc="Documentation/${stem}_docs.md"
                if [ ! -f "$doc" ]; then
                  MISSING="$MISSING $f"
                fi
              done
              CHANGED="$CHANGED $MISSING"
            fi
          fi

          # Deduplicate and trim
          CHANGED=$(echo "$CHANGED" | tr ' ' '\n' | sort -u | grep -v '^$' | tr '\n' ' ')
          echo "files=${CHANGED}" >> "$GITHUB_OUTPUT"
          echo "Changed/missing DAG files: ${CHANGED}"

      - name: Generate documentation
        run: |
          CHANGED="${{ steps.changed.outputs.files }}"
          if [ -z "$(echo $CHANGED | tr -d ' ')" ]; then
            echo "No DAG files to process."
            exit 0
          fi
          mkdir -p Documentation
          for dag_file in $CHANGED; do
            echo "Generating docs for $dag_file"
            python scripts/generate_dag_docs.py \
              --dag-file "$dag_file" \
              --output-dir Documentation
          done

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: dag-documentation
          path: Documentation/
          if-no-files-found: ignore

      - name: Commit generated documentation
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Documentation/
          if git diff --cached --quiet; then
            echo "Documentation is already up to date."
            exit 0
          fi

          git commit -m "Update DAG documentation [skip ci]"
          git push
